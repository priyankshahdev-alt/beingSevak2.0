<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Payment Successful | Being Sevak</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Open Sans',sans-serif;background:#f4f7fb;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
.success-card{max-width:500px;width:100%;background:#fff;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,0.08);overflow:hidden;text-align:center;animation:slideIn 0.6s ease;}
@keyframes slideIn{0%{opacity:0;transform:translateY(30px);}100%{opacity:1;transform:translateY(0);}}
.success-header{background:linear-gradient(to right,#009BD4,#046FB1,#083D8B);padding:30px;color:#fff;}
.success-header i{font-size:50px;margin-bottom:15px;display:block;}
.success-header h2{font-family:'Montserrat',sans-serif;font-size:1.5rem;font-weight:800;}
.success-header p{font-size:0.85rem;opacity:0.85;margin-top:6px;}
.success-body{padding:30px;}
.payment-id{background:#f0f8ff;border:2px solid #d0eaf5;border-radius:12px;padding:14px;margin-bottom:20px;word-break:break-all;}
.payment-id label{font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.75rem;color:#074D97;display:block;margin-bottom:4px;}
.payment-id span{font-size:0.9rem;color:#1a1a2e;font-weight:600;}
.thankyou{font-size:0.9rem;color:#4a5568;line-height:1.8;margin-bottom:24px;}
.back-btn{display:inline-block;padding:14px 36px;background:linear-gradient(135deg,#009BD4,#046FB1);color:#fff;text-decoration:none;border-radius:50px;font-family:'Montserrat',sans-serif;font-weight:700;font-size:0.95rem;transition:0.3s;box-shadow:0 8px 25px rgba(0,162,217,0.3);}
.back-btn:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(0,162,217,0.35);}
@media(max-width:600px){.success-card{border-radius:16px;}.success-header{padding:24px;}.success-header h2{font-size:1.2rem;}.success-body{padding:20px;}}
</style>
</head>
<body>
<div class="success-card">
  <div class="success-header">
    <i class="fas fa-check-circle"></i>
    <h2>Payment Successful!</h2>
    <p>Thank you for your generous donation</p>
  </div>
  <div class="success-body">
    <div class="payment-id" id="paymentInfo">
      <label>PAYMENT ID</label>
      <span id="payId"></span>
    </div>
    <p class="thankyou">Your contribution will help us make a real difference. A confirmation has been sent to your email.</p>
    <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Donation</a>
  </div>
</div>
<script>
var params = new URLSearchParams(window.location.search);
document.getElementById('payId').textContent = params.get('payment_id') || 'N/A';
</script>
</body>
</html>
